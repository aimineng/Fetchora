# Release automation for Fetchora.
#
# Pushing a v* tag (or dispatching this workflow manually with a tag) builds,
# self-tests and packages the app on all three desktop platforms, then attaches
# the three archives to a GitHub Release. Nothing here needs a secret: the
# default GITHUB_TOKEN is enough (see the release job's `permissions`).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v2.1 (required when dispatching from a branch)'
        required: false
        default: ''

# Default to read-only; the release job below opts into the write scope it
# needs to create the Release and upload assets.
permissions:
  contents: read

env:
  # Must match ci.yml: an artifact that CI has not validated must not ship.
  # 6.10.3 or newer is also a hard requirement on macOS 26, where Qt < 6.9.2
  # links the removed AGL framework (QTBUG-137687).
  QT_VERSION: '6.10.3'

  # The bundled engine. Pinned rather than "latest" so a release is reproducible
  # and ARIA2-BUILD-INFO.txt keeps meaning the same thing over time.
  ARIA2_VERSION: '1.37.0'

  # Used for the installer's file name and its Add/Remove Programs entry.
  APP_VERSION: '0.1'

jobs:
  build:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Publishing a partial release would be worse than publishing none.
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            # Two artifacts: the portable zip and the Inno Setup installer.
            # upload-artifact takes a newline-separated list of globs and only
            # errors when nothing at all matches, so the packaging step is what
            # guarantees both exist.
            asset: |
              Fetchora-windows-x64.zip
              dist/Fetchora-*-windows-x64-setup.exe
          - os: macos-latest
            # The architecture is filled in at package time by uname -m, so the
            # glob stays correct whichever runner image macOS-latest points at.
            asset: Fetchora-macos-*.dmg
          - os: ubuntu-latest
            asset: Fetchora-linux-*.tar.gz
    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      # ------------------------------------------------------------------ Qt
      # Same modules as ci.yml: Widgets/Network/Sql/Concurrent (qtbase), Svg
      # (qtsvg) and LinguistTools (qttools) all live in Qt's base installation,
      # so `modules:` stays empty - it only accepts addon modules.
      - name: Install Qt ${{ env.QT_VERSION }} (MinGW)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # windeployqt and the compiler have to come from the same Qt build as
          # build.ps1's MinGW toolchain, which Qt 6.8.3 declares as
          # qt.tools.win64_mingw1310.
          arch: win64_mingw
          # Argument GROUPS separated by spaces, each <name>,<version>,<arch>.
          # Two bare names would be read as name=tools_mingw with a nonsense
          # version, and aqt exits 1 (this is what broke the first CI run).
          # aqt 2.x: install-tool <host> <target> <tool_name> [<tool_variant>].
          # The tool NAME is the repository folder - MinGW 13.1.0 lives in
          # 	ools_mingw1310, not in 	ools_mingw (which stops at 8.1.0).
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'

      - name: Install Qt ${{ env.QT_VERSION }}
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}

      # ------------------------------------------------- engine for the tests
      # The official release archive, not a package manager's build: the same
      # binary is bundled into the package, so the self-test validates exactly
      # what ships, and the version is pinned instead of drifting.
      - name: Install aria2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:ARIA2_VERSION
          $asset = "aria2-$ver-win-64bit-build1.zip"
          $url = "https://github.com/aria2/aria2/releases/download/release-$ver/$asset"
          $zip = Join-Path $env:RUNNER_TEMP $asset
          $dist = "$env:GITHUB_WORKSPACE\aria2-dist"

          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          if (-not (Test-Path $zip)) { throw "could not download $url" }
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dist -Force

          $exe = Get-ChildItem $dist -Recurse -Filter aria2c.exe | Select-Object -First 1
          if (-not $exe) { throw "aria2c.exe is not in $asset" }
          # build.ps1 looks for the engine in the project root.
          Copy-Item $exe.FullName "$env:GITHUB_WORKSPACE\aria2c.exe" -Force
          & $exe.FullName --version | Select-String -Pattern 'aria2 version|Libraries:'
          if ($LASTEXITCODE -ne 0) { throw "$($exe.FullName) is not a working aria2c" }
          Write-Host "engine: $($exe.FullName)"
          # The licence files ride along from the same archive.
          Get-ChildItem $dist -Recurse -File | Select-Object -ExpandProperty Name

      - name: Install aria2 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install aria2
          # locateAria2() falls back to PATH; the bundle stays untouched so
          # macdeployqt starts from a clean, unmodified .app.
          command -v aria2c || { echo "::error::aria2c is not on PATH - refusing to package an untested build"; exit 1; }
          aria2c --version | head -1

      - name: Install aria2 and the system libraries Qt needs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libxcb-cursor0 is the library Qt 6.5+ added to the xcb plugin and
          # the one that is usually forgotten; libgl1-mesa-dev and libsqlite3-0
          # cover Qt's GL and QSqlDatabase. xvfb runs the self-test through the
          # real xcb plugin so a missing library fails here, not for a user.
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libdbus-1-3 libfontconfig1 libsqlite3-0 xvfb aria2
          command -v aria2c || { echo "::error::aria2c missing after apt-get install aria2"; exit 1; }
          command -v xvfb-run || { echo "::error::xvfb-run missing after apt-get install xvfb"; exit 1; }

      # ----------------------------------------------------------------- build
      - name: Configure, build and self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tools = $env:IQTA_TOOLS
          $mingw = Join-Path $tools 'mingw1310_64'
          if (-not (Test-Path "$mingw\bin\g++.exe")) {
            $found = Get-ChildItem $tools -Directory -Filter 'mingw*' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $mingw = $found.FullName }
          }
          if (-not (Test-Path "$mingw\bin\g++.exe")) { throw "no MinGW toolchain under $tools" }
          $cmake = (Get-Command cmake -ErrorAction Stop).Source
          # build.ps1 -Test runs the aria2c command-line check and the torrent
          # round trip, and throws unless "RESULT: all switches accepted" is in
          # the output - the release must not ship an unverified binary.
          .\build.ps1 -Release -Test -QtDir "$env:QT_ROOT_DIR" -MingwDir $mingw -CMake $cmake

      - name: Configure and build (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/dist" \
            -DCMAKE_BUNDLE_OUTPUT_DIRECTORY="$PWD/dist"
          cmake --build build --parallel

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          # Locate the executable rather than assuming the bundle layout.
          bin="$(find dist -type f -name Fetchora -perm -u+x | head -1)"
          if [ -z "$bin" ]; then echo "::error title=No executable in dist/::$(find dist -maxdepth 3 -print | tr '\n' ' ')"; exit 1; fi
          echo "testing $bin"
          out="$("$bin" --self-test 2>&1)"; status=$?
          printf '%s\n' "$out"
          if [ $status -ne 0 ]; then echo "::error::--self-test exited $status"; exit 1; fi
          if ! grep -q 'RESULT: all switches accepted' <<<"$out"; then
            echo "::error::the installed aria2c rejected the generated command line"; exit 1
          fi
          echo "self-test passed: every generated aria2c switch was accepted"

      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          install -m755 "$(command -v aria2c)" dist/aria2c
          set +e
          out="$(xvfb-run -a dist/Fetchora --self-test 2>&1)"; status=$?
          set -e
          printf '%s\n' "$out"
          if [ $status -ne 0 ]; then echo "::error::--self-test exited $status"; exit 1; fi
          if ! grep -q 'RESULT: all switches accepted' <<<"$out"; then
            echo "::error::the installed aria2c rejected the generated command line"; exit 1
          fi
          echo "self-test passed: every generated aria2c switch was accepted"

      # --------------------------------------------------------------- package
      # Asset names carry no version on purpose: the release tag is the version,
      # and stable names keep .../releases/latest/download/<name> links working
      # across releases.
      - name: Package the Windows zip and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "$env:GITHUB_WORKSPACE\stage\Fetchora"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build\Release\Fetchora.exe $stage
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md $stage
          # The repository tracks ca-bundle.crt as aria2's HTTPS trust store and
          # CMake copies it next to the executable, so a shipped build needs it.
          if (Test-Path ca-bundle.crt) { Copy-Item ca-bundle.crt $stage }
          else { Write-Host "::warning::ca-bundle.crt is not in the checkout - the zip ships without a CA bundle" }

          # ------ bundled engine ------------------------------------------
          # The engine is what a user actually downloads with, so it ships, and
          # it is the exact binary the self-test above just validated.
          $dist = "$env:GITHUB_WORKSPACE\aria2-dist"
          if (-not (Test-Path $dist)) { throw "aria2-dist is missing - the 'Install aria2' step did not run" }
          $exe = Get-ChildItem $dist -Recurse -Filter aria2c.exe | Select-Object -First 1
          Copy-Item $exe.FullName "$stage\aria2c.exe"

          # GPL-2.0 section 3 wants the source offer and the change log to travel
          # with the binary; these are the files aria2's own archive ships.
          foreach ($f in @('COPYING', 'LICENSE.OpenSSL', 'AUTHORS', 'ChangeLog', 'NEWS')) {
            $src = Get-ChildItem $dist -Recurse -Filter $f | Select-Object -First 1
            if ($src) { Copy-Item $src.FullName "$stage\aria2-$f" }
            else { Write-Host "::warning::aria2's $f was not in the archive" }
          }

          # Record what is actually in the package instead of trusting the
          # notice's prose: the licence table covers a set of libraries, and only
          # this output says which of them this build links.
          & "$stage\aria2c.exe" --version | Out-File -FilePath "$stage\ARIA2-BUILD-INFO.txt" -Encoding utf8
          Get-Content "$stage\ARIA2-BUILD-INFO.txt" | Select-String -Pattern 'aria2 version|Libraries:|Compiler:'

          # ------ licence texts -------------------------------------------
          # third_party/ holds the texts for aria2 and everything statically
          # linked into it, plus Qt's LGPL-3.0. They cannot be fetched at install
          # time, so they are copied verbatim.
          Copy-Item third_party "$stage\licenses" -Recurse
          Get-ChildItem "$stage\licenses" -Recurse -File | Measure-Object | ForEach-Object { "licence files staged: $($_.Count)" }

          # ------ Qt runtime ----------------------------------------------
          # windeployqt ships with Qt and must be called explicitly; it copies
          # the runtime DLLs, the platform plugins and the qt.conf that points
          # at them. --no-translations is safe because LanguageManager loads the
          # app's own catalogue from :/i18n, never Qt's qt_*.qm, and
          # --no-system-d3d-compiler matches build.ps1 -Deploy.
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --no-system-d3d-compiler "$stage\Fetchora.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

          # The portable zip is this staging tree, engine and licences included.
          Compress-Archive -Path $stage -DestinationPath Fetchora-windows-x64.zip -Force
          Get-Item Fetchora-windows-x64.zip | Select-Object Name, Length

          # ------ installer -----------------------------------------------
          # Inno Setup is not preinstalled on the runner. The zip above is
          # already a usable artifact, so a failure here must NOT lose the
          # release: it is reported and the job carries on with the zip only.
          choco install innosetup --no-progress -y
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            echo "::error title=Inno Setup not found::choco install innosetup did not produce ISCC.exe; the Release will carry the portable zip only."
            exit 1
          }

          & $iscc `
            "/DAppVersion=$env:APP_VERSION" `
            "/DStageDir=$stage" `
            "/DBuildDir=$env:GITHUB_WORKSPACE\dist" `
            "packaging\windows\fetchora.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

          # A zero exit code only means ISCC was happy; it does not prove the
          # file landed where the upload globs look. Ask for it by name.
          $installer = Get-ChildItem "$env:GITHUB_WORKSPACE\dist" -Filter '*-setup.exe' -ErrorAction SilentlyContinue |
                       Select-Object -First 1
          if (-not $installer) {
            $found = (Get-ChildItem "$env:GITHUB_WORKSPACE\dist" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ', '
            echo "::error title=ISCC produced no installer::dist/ contains: [$found]"
            exit 1
          }
          Write-Host ("installer: {0} ({1:N0} bytes)" -f $installer.Name, $installer.Length)

      - name: Package the macOS disk image
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # macdeployqt copies the Qt frameworks into the bundle and rewrites
          # their install names; -dmg then wraps the finished bundle, writing
          # Fetchora.dmg next to it. The app is unsigned (no certificate in CI),
          # which the release notes call out.
          "$QT_ROOT_DIR/bin/macdeployqt" dist/Fetchora.app -dmg
          mv dist/Fetchora.dmg "Fetchora-macos-$(uname -m).dmg"
          ls -l Fetchora-macos-*.dmg
          du -sh dist/Fetchora.app

      - name: Package the Linux tarball
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          name="Fetchora-linux-$(uname -m)"
          stage="stage/$name"
          mkdir -p "$stage"
          # Qt on Linux is linked dynamically against the distro's Qt 6, so the
          # tarball stays small and the release notes say what to install.
          cp dist/Fetchora "$stage/Fetchora"
          cp README.md LICENSE "$stage/"
          # The icon must be named after Icon= below for a desktop environment
          # to resolve it once the file is dropped into an icon theme.
          cp resources/app-256.png "$stage/fetchora.png"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Fetchora' \
            'Comment=aria2-powered download manager' \
            'Exec=Fetchora %u' \
            'Icon=fetchora' \
            'Terminal=false' \
            'Categories=Network;FileTransfer;P2P;' \
            'MimeType=application/x-bittorrent;x-scheme-handler/magnet;' \
            > "$stage/fetchora.desktop"
          tar -czf "$name.tar.gz" -C stage "$name"
          # Print the contents: an empty or wrong tarball must be obvious.
          tar -tzf "$name.tar.gz"

      - name: Upload the release asset
        uses: actions/upload-artifact@v4
        with:
          name: Fetchora-${{ matrix.os }}-release
          path: ${{ matrix.asset }}
          # Publishing nothing for a platform must break the run, not the release.
          if-no-files-found: error

  release:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Creating a Release and uploading its assets needs the write scope; this is
    # the only job that gets it.
    permissions:
      contents: write
    steps:
      - name: Download the packaged archives
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Resolve the release tag
        id: tag
        # Passed through env rather than interpolated into the script, so an
        # input can never be read as shell syntax.
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [ "$REF_TYPE" = "tag" ]; then tag="$REF_NAME"; fi
          if [ -z "$tag" ]; then
            echo "::error::dispatching from a branch needs the 'tag' input (e.g. v2.1) - a release must have a tag"
            exit 1
          fi
          case "$tag" in
            v*) ;;
            *) echo "::error::release tags must start with 'v' (got '$tag')"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publishing $tag"

      - name: Check that every expected asset is present
        # `fail_on_unmatched_files` below only proves that each *pattern* matched
        # something. v0.1.1 shipped without its Windows installer because the
        # `.exe` pattern was missing from that list entirely - all three listed
        # patterns matched, so nothing complained and the installer went no
        # further than the artifact. Asserting the full set here is what turns
        # that silent drop into a failed run.
        run: |
          set -euo pipefail
          missing=0
          for pattern in '*.zip' '*.exe' '*.dmg' '*.tar.gz'; do
            if ! compgen -G "assets/$pattern" > /dev/null; then
              echo "::error title=Release asset missing ($pattern)::assets/ contains: $(ls assets | tr '\n' ' ')"
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "refusing to publish a partial release"
            exit 1
          fi
          ls -l assets

      - name: List what will be published
        run: ls -l assets

      - name: Create the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Fetchora ${{ steps.tag.outputs.tag }}
          # generate_release_notes prepends/append the auto-generated notes to
          # this body, so the platform caveats below always appear.
          generate_release_notes: true
          # A missing archive must fail the release instead of publishing two.
          fail_on_unmatched_files: true
          files: |
            assets/*.zip
            assets/*.exe
            assets/*.dmg
            assets/*.tar.gz
          body: |
            ### Downloads

            | Platform | Asset | Notes |
            | --- | --- | --- |
            | Windows 10/11 (x64) | `Fetchora-*-windows-x64-setup.exe` | Installer. No administrator rights needed, and **aria2 is included**. |
            | Windows 10/11 (x64), portable | `Fetchora-windows-x64.zip` | Same thing without an installer: unpack anywhere and run `Fetchora.exe`. |
            | macOS (Apple silicon or Intel) | `Fetchora-macos-*.dmg` | Open the image and drag Fetchora into Applications. |
            | Linux (x86_64) | `Fetchora-linux-*.tar.gz` | Binary, `fetchora.desktop` and the icon. |

            **The Windows packages include the engine** - `aria2c.exe` 1.37.0, the official
            upstream build, unmodified - so they work as downloaded. See `licenses/` for its
            GPL-2.0 text and `ARIA2-BUILD-INFO.txt` for exactly what that build links.
            **macOS and Linux do not bundle the engine.** Fetchora drives `aria2c` 1.36+;
            install it with `brew install aria2` or your package manager. A brew- or apt-built
            aria2 is dynamically linked against that system's own libraries, so copying just
            the executable would produce something that cannot start elsewhere.

            **Linux:** the tarball is portable but not self-contained - the binary links against
            the *distribution's* Qt 6 (6.5 or newer) at runtime. Install it, for example on
            Debian/Ubuntu:

            ```sh
            sudo apt install libqt6widgets6 libqt6network6 libqt6sql6 libqt6svg6 \
                             libqt6concurrent6 libxcb-cursor0
            ```

            Unpack the tarball anywhere, then optionally install the launcher and icon:

            ```sh
            install -Dm644 fetchora.desktop ~/.local/share/applications/fetchora.desktop
            install -Dm644 fetchora.png ~/.local/share/icons/hicolor/256x256/apps/fetchora.png
            ```

            **macOS:** the build is unsigned and not notarised, so Gatekeeper will warn on first
            launch - right-click the app and choose *Open*, or run
            `xattr -dr com.apple.quarantine /Applications/Fetchora.app`.

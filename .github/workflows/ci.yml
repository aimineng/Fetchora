# Continuous integration for Fetchora.
#
# Builds the app in Release on the three desktop platforms the project supports
# and runs the project's own headless self-test (`Fetchora --self-test`, see
# README "Self-tests"): it checks every aria2c switch the settings layer
# generates against the engine that is actually installed. That test is the
# only automated test in the tree, so every job installs aria2 first and fails
# if the engine is missing - a job must never pass while testing nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a branch be verified without pushing a commit. `package` defaults to
  # true because someone who clicks Run wants the whole thing; the automatic runs
  # below only package on a push to main.
  workflow_dispatch:
    inputs:
      package:
        description: 'Also build the Windows installer (adds a few minutes)'
        type: boolean
        default: true

# CI only ever reads the repository.
permissions:
  contents: read

# A newer push to the same ref makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt 6.10.3 - the version the project is developed against, and, more
  # importantly, new enough to build on macOS 26.
  #
  # macOS 26 "Tahoe" removed the AGL framework. Qt's FindWrapOpenGL.cmake still
  # passed `-framework AGL` on Apple hosts, so every link failed with
  # "ld: framework 'AGL' not found" (QTBUG-137687, fixed in Qt 6.9.2 - see
  # https://bugreports.qt.io/browse/QTBUG-137687). `macos-latest` has since
  # rolled to macOS 26, so anything older than 6.9.2 cannot link there at all.
  #
  # 6.10.3's win64_mingw package is still "Prebuilt Components for MinGW 13.1.0",
  # so the toolchain pinned below is unchanged.
  QT_VERSION: '6.10.3'

  # The engine the Windows self-test runs, and the one the release packages
  # bundle. Pinned so CI and the shipped product cannot drift apart.
  ARIA2_VERSION: '1.37.0'

jobs:
  build:
    name: Build and self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken platform must not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: build/Release/Fetchora.exe
          - os: macos-latest
            artifact: dist/Fetchora.app
          - os: ubuntu-latest
            artifact: dist/Fetchora
    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      # ------------------------------------------------------------------ Qt
      # The app links Widgets/Network/Sql/Concurrent (archive: qtbase), Svg
      # (qtsvg) and LinguistTools (qttools). All three archives belong to Qt's
      # *base* installation, which is what this action installs by default, so
      # no addon is requested: `modules:` only accepts addons such as qtcharts
      # or qtwebengine, and asking for `qtsvg`/`qttools` there would fail the
      # install.
      - name: Install Qt ${{ env.QT_VERSION }} (MinGW)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # Qt's win64_mingw package needs the matching MinGW toolchain, and it
          # is NOT pulled in automatically.
          #
          # The `tools` input is a space-separated list of argument groups; the
          # action replaces each group's commas with spaces and runs
          # `aqt install-tool <host> <target> <group...>`.
          #
          # aqt 2.x takes only `install-tool <host> <target> <tool_name>
          # [<tool_variant>]` - there is NO separate version positional any more.
          # A three-field group ("name,version,arch") therefore passes four
          # positionals, argparse rejects the extra one and exits 2, which is
          # exactly how the second and third runs failed.
          #
          # The tool NAME is the repository folder, and the Qt 6.8 toolchain is
          # NOT in `tools_mingw` - that folder stops at MinGW 8.1.0. MinGW 13.1.0
          # lives in `tools_mingw1310`, whose package is qt.tools.win64_mingw1310:
          # download.qt.io/online/qtsdkrepository/windows_x86/desktop/
          #     tools_mingw1310/Updates.xml
          # This matches aqt's own documented form
          # `aqt install-tool windows desktop tools_mingw qt.tools.win64_mingw810`.
          arch: win64_mingw
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'

      - name: Install Qt ${{ env.QT_VERSION }}
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}

      # ------------------------------------------------- engine for the tests
      # aria2c.exe is not in the repository (it is gitignored), so the self-test
      # has nothing to validate until the engine is installed.
      #
      # This downloads the same official archive the release packages bundle, so
      # CI validates exactly the engine users get - a package manager's build
      # could pass here and behave differently in the shipped product.
      - name: Install aria2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:ARIA2_VERSION
          $asset = "aria2-$ver-win-64bit-build1.zip"
          $url = "https://github.com/aria2/aria2/releases/download/release-$ver/$asset"
          $zip = Join-Path $env:RUNNER_TEMP $asset
          $dist = "$env:GITHUB_WORKSPACE\aria2-dist"

          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dist -Force

          $exe = Get-ChildItem $dist -Recurse -Filter aria2c.exe | Select-Object -First 1
          if (-not $exe) { throw "aria2c.exe is not in $asset" }
          & $exe.FullName --version | Select-String -Pattern 'aria2 version|Libraries:'
          if ($LASTEXITCODE -ne 0) { throw "$($exe.FullName) is not a working aria2c" }
          # build.ps1 copies an aria2c.exe found in the project root next to the
          # executable and then runs its extra torrent/engine round trip with it.
          Copy-Item $exe.FullName "$env:GITHUB_WORKSPACE\aria2c.exe" -Force
          Write-Host "engine: $($exe.FullName)"

      - name: Install aria2 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install aria2
          # locateAria2() looks next to the binary first and then on PATH; the
          # .app bundle is deliberately left untouched so the release job gets a
          # clean bundle for macdeployqt. Assert the PATH lookup will succeed.
          command -v aria2c || { echo "::error::aria2c is not on PATH - refusing to run a self-test that tests nothing"; exit 1; }
          aria2c --version | head -1

      - name: Install aria2 and the system libraries Qt needs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The xcb platform plugin links all of the libxcb-* below;
          # libxcb-cursor0 is the one Qt 6.5 added and the one that is usually
          # forgotten, and libgl1-mesa-dev / libsqlite3-0 are what Qt's GL and
          # QSqlDatabase need. xvfb lets the self-test run on a real X server
          # through that plugin instead of hiding a missing library behind the
          # offscreen plugin.
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libdbus-1-3 libfontconfig1 libsqlite3-0 xvfb aria2
          command -v aria2c || { echo "::error::aria2c missing after apt-get install aria2"; exit 1; }
          command -v xvfb-run || { echo "::error::xvfb-run missing after apt-get install xvfb"; exit 1; }

      # ----------------------------------------------------------------- build
      # The Windows helper is the project's own; it configures with the MinGW
      # generator, builds with --parallel and then runs both self-tests (the
      # aria2c command line and the torrent round trip), throwing if
      # "RESULT: all switches accepted" is not in the output.
      - name: Configure, build and self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tools = $env:IQTA_TOOLS
          $mingw = Join-Path $tools 'mingw1310_64'
          if (-not (Test-Path "$mingw\bin\g++.exe")) {
            $found = Get-ChildItem $tools -Directory -Filter 'mingw*' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $mingw = $found.FullName }
          }
          if (-not (Test-Path "$mingw\bin\g++.exe")) {
            # The annotation is the only error text that can be read without
            # authenticating, so it has to carry the diagnosis by itself.
            $have = (Get-ChildItem $tools -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ', '
            echo "::error title=No MinGW toolchain under IQTA_TOOLS::IQTA_TOOLS=$tools contains: $have"
            throw "no MinGW toolchain under $tools"
          }
          $cmake = (Get-Command cmake -ErrorAction Stop).Source
          Write-Host "Qt:    $env:QT_ROOT_DIR"
          Write-Host "MinGW: $mingw"
          Write-Host "CMake: $cmake"
          .\build.ps1 -Release -Test -QtDir "$env:QT_ROOT_DIR" -MingwDir $mingw -CMake $cmake

      # The engine must not outlive the app, and must come back when it is killed.
      # Both are invisible until they break: an orphaned aria2c keeps downloading
      # with no window to stop it, and an engine that stays dead looks like the
      # app ignoring every new task. This starts the real app and watches real
      # processes, which is the only way to check either.
      #
      # The output is echoed and, on failure, folded into the annotation: the job
      # log needs a token to read, annotations do not, so the diagnosis has to fit
      # in the annotation.
      - name: Engine supervision (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'engine-supervision.log'
          & .\tools\check-engine-supervision.ps1 -App build\Release\Fetchora.exe *> $log
          $status = $LASTEXITCODE
          Get-Content $log | Write-Host
          if ($status -ne 0) {
            $tail = ((Get-Content $log -Tail 20) -join ' | ') -replace '%', '%25'
            echo "::error title=Engine supervision failed ($status)::$tail"
            exit $status
          }

      # Single-config generator, so CMAKE_BUILD_TYPE applies as written.
      #
      # The binary is forced into dist/ so every platform has one stable
      # artifact path. macOS needs CMAKE_BUNDLE_OUTPUT_DIRECTORY for that: a
      # MACOSX_BUNDLE target ignores CMAKE_RUNTIME_OUTPUT_DIRECTORY, so setting
      # only the latter leaves Fetchora.app behind in build/.
      #
      # The output is teed and re-emitted as an ::error:: annotation: the job log
      # itself needs authentication to read, annotations are public, and "Process
      # completed with exit code 2" on its own says nothing about which compile
      # or copy step broke.
      #
      # NOTE: Actions runs `run:` blocks with `bash -e`. Combined with `pipefail`
      # that aborts at the first failing command, which is how an earlier version
      # of this step managed to fail with no diagnostic at all. `-e` is therefore
      # switched off for the whole step and every status is checked by hand.
      - name: Configure and build (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          set +e
          set -o pipefail

          {
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
              -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/dist" \
              -DCMAKE_BUNDLE_OUTPUT_DIRECTORY="$PWD/dist" &&
            cmake --build build --parallel
          } > cmake-build.log 2>&1
          status=$?

          if [ $status -ne 0 ]; then
            # The undefined-symbol list IS the diagnosis for a link failure, so
            # it is what goes into the annotation - "clang++: error: linker
            # command failed" on its own says nothing.
            detail="$(awk '/Undefined symbols/{f=1} f&&c<14{print;c++}' cmake-build.log | tr '\n' ' ')"
            if [ -z "$detail" ]; then
              detail="$(grep -i -m8 -E 'error|Error copying|duplicate symbol|ld: |framework not found|not found' cmake-build.log | tr '\n' ' ')"
            fi
            echo "::error title=Build failed ($status)::$(printf '%s' "$detail" | cut -c1-1800)"
            echo "--- last 60 lines of the build log ---"
            tail -60 cmake-build.log
            exit $status
          fi

          echo "--- build succeeded; dist/ contains: ---"
          if [ -d dist ]; then
            find dist -maxdepth 3 -print
          else
            echo "::error title=dist/ was not created::CMake put the binary somewhere else; the self-test cannot find it."
            exit 1
          fi

          exe="$(find dist -type f -name Fetchora -perm -u+x | head -1)"
          if [ -z "$exe" ]; then
            echo "::error title=The build produced no executable::$(find dist -maxdepth 3 -print | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          echo "built $exe"

      # ------------------------------------------------------------- self-test
      # GitHub's macOS runners have a real user session, so the cocoa plugin is
      # the honest test here - no platform override.
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          # Find the executable instead of hard-coding the bundle layout, and say
          # what was found - a wrong path here would look like a failed test.
          bin="$(find dist -type f -name Fetchora -perm -u+x | head -1)"
          if [ -z "$bin" ]; then
            echo "::error title=No executable in dist/::$(find dist -maxdepth 3 -print | tr '\n' ' ')"
            exit 1
          fi
          echo "testing $bin"
          out="$("$bin" --self-test 2>&1)"; status=$?
          printf '%s\n' "$out"
          if [ $status -ne 0 ]; then echo "::error title=--self-test exited $status::$(printf '%s' "$out" | tail -c 900)"; exit 1; fi
          if ! grep -q 'RESULT: all switches accepted' <<<"$out"; then
            echo "::error title=aria2c rejected the generated command line::$(printf '%s' "$out" | tail -c 900)"
            exit 1
          fi
          echo "self-test passed: every generated aria2c switch was accepted"

      # Runs on a virtual X server so the xcb plugin (and therefore the apt
      # packages above) is exercised rather than bypassed.
      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # locateAria2() looks next to the executable first; putting it there
          # also documents the layout users are told to install.
          install -m755 "$(command -v aria2c)" dist/aria2c
          set +e
          out="$(xvfb-run -a dist/Fetchora --self-test 2>&1)"; status=$?
          set -e
          printf '%s\n' "$out"
          if [ $status -ne 0 ]; then echo "::error title=--self-test exited $status::$(printf '%s' "$out" | tail -c 900)"; exit 1; fi
          if ! grep -q 'RESULT: all switches accepted' <<<"$out"; then
            echo "::error title=aria2c rejected the generated command line::$(printf '%s' "$out" | tail -c 900)"
            exit 1
          fi
          echo "self-test passed: every generated aria2c switch was accepted"

      # ------------------------------------------------- per-commit packages
      # Every push to main gets a downloadable installer, so a build can be
      # handed to someone without cutting a release first. Pull requests do not:
      # a PR is judged on whether it builds and passes the self-test, and
      # packaging adds minutes (chocolatey plus LZMA2 over the whole Qt runtime)
      # for an artifact nobody collects from a PR. workflow_dispatch can ask.
      #
      # The version comes from the executable's own version resource, so the file
      # name cannot drift from what the app reports; the short commit is appended
      # to the name only, never to the version metadata.
      - name: Package the Windows installer
        if: runner.os == 'Windows' && (github.event_name == 'push' || inputs.package)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $sha = "${{ github.sha }}".Substring(0, 7)
          .\packaging\windows\package.ps1 `
            -QtDir "$env:QT_ROOT_DIR" `
            -Aria2Dist "$env:GITHUB_WORKSPACE\aria2-dist" `
            -OutDir "$env:GITHUB_WORKSPACE\dist" `
            -NameSuffix "-$sha"
          if ($LASTEXITCODE -ne 0) { throw "packaging failed" }

      - name: Upload the Windows packages
        if: runner.os == 'Windows' && (github.event_name == 'push' || inputs.package)
        uses: actions/upload-artifact@v4
        with:
          name: Fetchora-windows-packages
          # Both live in dist/, so the artifact stays flat: upload-artifact keeps
          # the structure relative to the least common ancestor of the matches.
          path: |
            dist/Fetchora-windows-x64.zip
            dist/Fetchora-*-windows-x64-setup.exe
          if-no-files-found: error

      # ----------------------------------------------------------------- upload
      # Raw build output only - the Qt runtime is deployed by release.yml, not
      # here, so these artifacts are for inspecting a build, not for shipping.
      - name: Upload the built artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fetchora-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          # An empty upload would mean the build produced nothing.
          if-no-files-found: error

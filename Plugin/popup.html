<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Aria2 Downloader</title>
<style>
  :root {
    --bg: #202020;
    --card: #2b2b2b;
    --card2: #323232;
    --stroke: #3a3a3a;
    --text: #ffffff;
    --text2: #c5c5c5;
    --text3: #8b8b8b;
    --accent: #4cc2ff;
    --success: #6ccb5f;
    --critical: #ff99a4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 340px;
    font: 13px/1.45 "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--stroke);
  }
  .logo {
    width: 28px; height: 28px; border-radius: 6px;
    background: linear-gradient(180deg, #3b9de0, #0f6cbd);
    display: grid; place-items: center;
    font-size: 15px; color: #fff;
  }
  .title { font-weight: 600; font-size: 14px; }
  .subtitle { color: var(--text3); font-size: 11px; }
  .status {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text2);
    padding: 4px 10px; border-radius: 11px; background: var(--card);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--critical); }
  .dot.on { background: var(--success); }
  main { padding: 12px 16px 16px; display: grid; gap: 10px; }
  .card {
    background: var(--card); border: 1px solid var(--stroke);
    border-radius: 8px; padding: 12px;
  }
  label { display: block; font-size: 11px; color: var(--text3); margin-bottom: 6px; }
  input[type=text] {
    width: 100%; padding: 7px 9px; border-radius: 4px;
    border: 1px solid #4a4a4a; background: #2d2d2d; color: var(--text);
    font: inherit; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button {
    padding: 8px 12px; border-radius: 4px; border: 1px solid #4a4a4a;
    background: #2d2d2d; color: var(--text); font: inherit; cursor: pointer;
    transition: background .12s ease;
  }
  button:hover { background: #383838; }
  button:active { background: #414141; }
  button.primary { background: #0f6cbd; border-color: #0f6cbd; color: #fff; }
  button.primary:hover { background: #1a7fd4; }
  button.ghost { background: transparent; border-color: transparent; color: var(--accent); }
  button.ghost:hover { background: #2e2e2e; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--card2); border-radius: 6px; padding: 8px 10px; }
  .stat .k { font-size: 10px; color: var(--text3); }
  .stat .v { font-size: 15px; font-weight: 600; }
  .task { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid #2f2f2f; }
  .task:first-child { border-top: 0; }
  .task .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .task .pct { font-size: 11px; color: var(--text3); }
  .bar { height: 3px; border-radius: 2px; background: #3a3a3a; overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .muted { color: var(--text3); font-size: 11px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .switch { position: relative; width: 40px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .track {
    position: absolute; inset: 0; border-radius: 10px; background: #2d2d2d;
    border: 1px solid #4a4a4a; pointer-events: none; transition: background .15s ease;
  }
  .track::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--text2); transition: transform .15s ease, background .15s ease;
  }
  .switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(20px); background: #202020; }
  footer {
    padding: 10px 16px 14px; border-top: 1px solid var(--stroke);
    display: flex; justify-content: space-between; align-items: center;
  }
</style>
</head>
<body>
<header>
  <div class="logo">⬇</div>
  <div>
    <div class="title">Aria2 Downloader</div>
    <div class="subtitle" id="version">正在检测桌面程序…</div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">未连接</span></div>
</header>

<main>
  <div class="card">
    <label for="url">发送链接到下载器</label>
    <div class="row">
      <input type="text" id="url" placeholder="https://… 或 magnet:?xt=urn:btih:…">
      <button class="primary" id="send" style="flex:0 0 auto">发送</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="ghost" id="paste">粘贴剪贴板</button>
      <button class="ghost" id="currentPage">下载当前标签页</button>
    </div>
  </div>

  <div class="card">
    <div class="toggle">
      <div>
        <div>自动接管浏览器下载</div>
        <div class="muted">关闭后所有下载都会留在浏览器中</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="intercept">
        <span class="track"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <label>当前速度</label>
    <div class="grid">
      <div class="stat"><div class="k">下载</div><div class="v" id="downSpeed">--</div></div>
      <div class="stat"><div class="k">上传</div><div class="v" id="upSpeed">--</div></div>
      <div class="stat"><div class="k">活动</div><div class="v" id="activeCount">0</div></div>
      <div class="stat"><div class="k">等待</div><div class="v" id="waitingCount">0</div></div>
    </div>
    <div id="taskList" style="margin-top:10px"></div>
  </div>

  <div class="row">
    <button id="pauseAll">全部暂停</button>
    <button id="resumeAll">全部开始</button>
  </div>
</main>

<footer>
  <button class="ghost" id="options">扩展设置</button>
  <span class="muted" id="hint"></span>
</footer>

<script src="popup.js"></script>
</body>
</html>
